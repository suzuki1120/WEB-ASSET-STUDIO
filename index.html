<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Asset Studio | Px / WebP / WebM Converter</title>
  <meta name="description" content="Px計算、画像WebP変換、動画WebM変換を1つに統合した、フロントエンド開発のためのオールインワン・アセットスタジオです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="bg-vignette"></div>
  <div class="container">
    <header>
      <h1>Web Asset <span class="accent">Studio</span></h1>
      <p class="subtitle" id="subtitle">親要素とターゲットの値を入力して即座に変換</p>
    </header>

    <main class="glass-card">
      <nav class="tabs">
        <button class="tab-btn active" data-mode="percentage">% (Percentage)</button>
        <button class="tab-btn" data-mode="vw">vw (Viewport Width)</button>
        <button class="tab-btn" data-mode="ratio">Aspect Ratio</button>
        <button class="tab-btn" data-mode="clamp">Fluid clamp()</button>
        <button class="tab-btn" data-mode="webp">Image to WebP</button>
        <button class="tab-btn" data-mode="video">Video to WebM</button>
      </nav>

      <div id="calc-panel">
        <div class="input-group">
          <label for="parent-px" id="parent-label">親要素のサイズ (px)</label>
          <div class="input-wrapper">
            <input type="number" id="parent-px" placeholder="例: 1000" min="1" step="any">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="divider">
          <div class="line"></div>
          <div class="icon">/</div>
          <div class="line"></div>
        </div>

        <div class="input-group">
          <label for="target-px">ターゲットのサイズ (px)</label>
          <div class="input-wrapper">
            <input type="number" id="target-px" placeholder="例: 500" min="0" step="any">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="result-area">
          <div class="result-label">変換結果</div>
          <div class="result-display">
            <span id="result-value">0</span><span class="percent" id="result-unit">%</span>
          </div>
          <div class="copy-hint" id="copy-btn">クリックしてコピー</div>
        </div>
      </div>

      <div id="clamp-panel" class="hidden">
        <div class="input-grid">
          <div class="input-group">
            <label>最小サイズ (Min px)</label>
            <div class="input-wrapper">
              <input type="number" id="clamp-min-size" placeholder="16" step="any">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>最大サイズ (Max px)</label>
            <div class="input-wrapper">
              <input type="number" id="clamp-max-size" placeholder="24" step="any">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>最小画面幅 (Min Viewport px)</label>
            <div class="input-wrapper">
              <input type="number" id="clamp-min-vw" placeholder="320" step="any">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>最大画面幅 (Max Viewport px)</label>
            <div class="input-wrapper">
              <input type="number" id="clamp-max-vw" placeholder="1280" step="any">
              <span class="unit">px</span>
            </div>
          </div>
        </div>

        <div class="result-area" id="clamp-result-area">
          <div class="result-label">clamp() 関数</div>
          <div class="result-code" id="clamp-value">値を選択してください</div>
          <div class="copy-hint" id="clamp-copy-btn">クリックしてコピー</div>
        </div>
      </div>

      <div id="image-panel" class="hidden">
        <div class="settings-group">
          <div class="setting-item">
            <label>品質 (Quality)</label>
            <div class="range-wrapper">
              <input type="range" id="quality-range" min="0" max="100" value="80">
              <span id="quality-val">80%</span>
            </div>
          </div>
          <div class="setting-item flex-row">
            <label for="lossless-check">ロスレス (Lossless)</label>
            <input type="checkbox" id="lossless-check" class="ios-switch-input">
            <label for="lossless-check" class="ios-switch-label"></label>
          </div>
        </div>

        <div id="drop-zone" class="drop-zone">
          <div class="drop-icon">📁</div>
          <p>JPEG / PNG ファイルをドロップ</p>
          <span class="drop-subtext">または クリックして選択</span>
          <input type="file" id="file-input" multiple accept="image/jpeg,image/png" hidden>
        </div>

        <div id="preview-section" class="hidden">
          <h3 class="section-title">変換待ちファイル</h3>
          <div id="file-list" class="file-list">
            <!-- プレビューアイテムがここに追加される -->
          </div>
          <button id="start-conversion" class="primary-btn">変換を開始する</button>
        </div>

        <button id="download-all" class="primary-btn hidden">全ファイルをダウンロード</button>
      </div>

      <div id="video-panel" class="hidden">
        <div class="settings-group">
          <div class="setting-item">
            <label>ビットレート (Bitrate / Quality)</label>
            <div class="range-wrapper">
              <input type="range" id="video-bitrate-range" min="1" max="100" value="50">
              <span id="video-bitrate-val">10 Mbps</span>
            </div>
          </div>
          <div class="setting-item flex-row">
            <label for="video-lossless-check">ロスレス (Lossless / High BPS)</label>
            <input type="checkbox" id="video-lossless-check" class="ios-switch-input">
            <label for="video-lossless-check" class="ios-switch-label"></label>
          </div>
          <div class="setting-item flex-row">
            <label for="video-mute-check">音声なし (Mute Audio)</label>
            <input type="checkbox" id="video-mute-check" class="ios-switch-input">
            <label for="video-mute-check" class="ios-switch-label"></label>
          </div>
        </div>

        <div id="video-drop-zone" class="drop-zone">
          <div class="drop-icon">🎬</div>
          <p>MP4 ファイルをドロップ</p>
          <span class="drop-subtext">または クリックして選択</span>
          <input type="file" id="video-file-input" accept="video/mp4" hidden>
        </div>

        <div id="video-preview-section" class="hidden">
          <h3 class="section-title">プレビュー & 変換</h3>
          <div class="video-preview-container">
            <video id="convert-video" controls muted></video>
            <div class="convert-progress-overlay hidden" id="convert-overlay">
              <div class="spinner"></div>
              <p>変換中... (<span id="convert-percent">0</span>%)</p>
            </div>
          </div>
          <button id="start-video-conversion" class="primary-btn">WebMに変換して保存</button>
          <div id="video-result-link" class="hidden">
            <a href="#" id="video-download-btn" class="primary-btn"
              style="background: var(--accent-color)">WebMをダウンロード</a>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Px & Image Converter. Crafted with Care.</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>

</html>
